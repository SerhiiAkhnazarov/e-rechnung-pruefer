# pages.yml — publishes the E-Rechnung Prüfer as the GitHub Pages site of this repository
# (Settings → Pages → Source: "GitHub Actions" must be selected once).
# Runs only after the workflow "verify" has passed for a commit on main (all its jobs: Linux, Windows,
# platform comparison, KoSIT JAR, veraPDF). The page is rebuilt from that commit with the verification report
# of that very run (artifact "verification"), so the status line in the program ("… Testreihen bestanden …
# – GitHub Actions …") is the result of the CI run of exactly these sources (tools/build-standalone.cjs
# compares the file fingerprint), and its program (programSha256: the page without the build note) must be the
# one the CI run tested. Published beside the program: its SBOM and VEX, the bill of materials of the test
# environment of that run, the static pages (vulnerability reports, CVD policy, security advisories, information for
# users, Impressum, privacy) and .well-known (security.txt, the CSAF 2.0 distribution). Every published file gets a
# build provenance attestation and the program an SBOM attestation (GitHub artifact attestations, Sigstore):
# `gh attestation verify E-Rechnung-Pruefer.html -R SerhiiAkhnazarov/e-rechnung-pruefer`.
# After the deployment every published file is read back over HTTPS and compared byte for byte with this build
# (tools/check-published.cjs). URL, status line, SHA-256 of the published files and the result of the read-back are
# recorded as check run "pages report" of the commit.
name: pages
on:
  # workflow_run runs with the permissions of this repository: it deploys only runs of verify that a push to main of
  # this repository started (verify has no pull_request trigger; the job condition below checks event and repository),
  # and it builds the commit that run verified
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [verify]
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read      # checkout
      pages: write        # deployment
      id-token: write     # deployment and artifact attestations (Sigstore)
      attestations: write # artifact attestations
      actions: read       # the artifact of the verify run
      checks: write       # check run "pages report"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true
      - name: Verification report of the successful verify run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification
          path: ci-verification
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the page with the CI verification status
        run: |
          set -e -o pipefail
          {
            # build/reports/ is not part of the repository (outputs are built in CI only)
            mkdir -p build/reports
            cp ci-verification/build/reports/VERIFICATION.json build/reports/VERIFICATION.json
            VERSION="$(sed -n -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' CHANGELOG.md | head -n 1)"
            node tools/build-standalone.cjs --version "${VERSION}"
            # the status line must come from this CI run and report every suite as passed ("N von N … 0 fehlgeschlagen")
            node -e "const b = require('./dist/BUILD_INFO.json'); console.log('version: ' + b.version + ', verification: ' + b.verification); if (!/GitHub Actions/.test(b.verification) || !/^(\d+) von \1 Testreihen bestanden, 0 fehlgeschlagen/.test(b.verification)) process.exit(1)"
            # the program to be published is the program the CI run tested (same page apart from the build note)
            node -e "const a = require('./dist/BUILD_INFO.json'), t = require('./ci-verification/dist/BUILD_INFO.json'); console.log('program SHA-256: to be published ' + a.programSha256 + ', tested ' + t.programSha256); if (!a.programSha256 || a.programSha256 !== t.programSha256) process.exit(1)"
            mkdir -p site
            cp dist/E-Rechnung-Pruefer.html site/index.html
            cp dist/E-Rechnung-Pruefer.html site/E-Rechnung-Pruefer.html
            cp dist/BUILD_INFO.json site/BUILD_INFO.json
            cp dist/sbom.cdx.json site/sbom.cdx.json
            cp dist/vex.cdx.json site/vex.cdx.json
            cp build/STANDARDS_MANIFEST.json site/STANDARDS_MANIFEST.json
            cp build/reports/VERIFICATION.json site/VERIFICATION.json
            cp ci-verification/build/reports/test-environment.cdx.json site/test-environment.cdx.json
            # static pages and .well-known (security.txt, CSAF): hidden files included
            cp -R dist/site-pages/. site/
            (cd site && find . -type f | sort | sed 's#^\./##' | xargs sha256sum) | tee site-files.txt
          } 2>&1 | tee pages-build.txt
      - name: Build provenance of every published file (GitHub artifact attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            site/E-Rechnung-Pruefer.html
            site/BUILD_INFO.json
            site/sbom.cdx.json
            site/vex.cdx.json
            site/test-environment.cdx.json
            site/STANDARDS_MANIFEST.json
            site/VERIFICATION.json
            site/.well-known/security.txt
            site/.well-known/csaf/provider-metadata.json
            site/.well-known/csaf/white/*/*.json
      - name: SBOM attestation of the program (sbom.cdx.json)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: site/E-Rechnung-Pruefer.html
          sbom-path: site/sbom.cdx.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Read every published file back (HTTPS, as a visitor gets it) and compare it with this build
        id: published
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -o pipefail
          node tools/check-published.cjs "${PAGE_URL}" --commit "${HEAD_SHA}" --local site \
            --expect-sha256 "$(node -e "console.log(require('./dist/BUILD_INFO.json').sha256)")" | tee published-check.txt
      - name: Publish the deployment as check run "pages report"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VERIFY_RUN: ${{ github.event.workflow_run.html_url }}
          DEPLOYMENT: ${{ steps.deployment.outcome }}
          PUBLISHED: ${{ steps.published.outcome }}
        run: |
          {
            echo "page: ${PAGE_URL:-not deployed}"
            echo "verify run: ${VERIFY_RUN}"
            node -e "const b = require('./dist/BUILD_INFO.json'); console.log('version: ' + b.version); console.log('verification: ' + b.verification); console.log('page SHA-256: ' + b.sha256); console.log('program SHA-256: ' + b.programSha256)" || true
            echo
            echo "published files (SHA-256):"
            cat site-files.txt 2>/dev/null || true
            echo
            echo "build (step \"Build the page with the CI verification status\"):"
            cat pages-build.txt 2>/dev/null || echo "not run"
            echo
            echo "read back over HTTPS (tools/check-published.cjs):"
            cat published-check.txt 2>/dev/null || echo "not run"
          } > pages-report.txt
          outcome=failure
          if [ "${DEPLOYMENT}" = success ] && [ "${PUBLISHED}" = success ]; then outcome=success; fi
          rc=0
          node .github/scripts/check-run.cjs --name "pages report" --sha "${HEAD_SHA}" \
            --gate "${outcome}" --gate-label "Deployment (actions/deploy-pages) und Abruf der veröffentlichten Dateien (tools/check-published.cjs)" --attach pages-report.txt > check-run.json || rc=$?
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" --input check-run.json > /dev/null || echo "::warning::check run could not be published"
          exit "${rc}"
