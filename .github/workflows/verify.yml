# verify.yml — complete, independent verification of the E-Rechnung Prüfer on GitHub Actions, and its publication.
#
# Every source is fetched by tools/fetch-sources.cjs at the commits / SHA-256 recorded in
# build/STANDARDS_MANIFEST.json (single source of truth, the same script as in local runs).
#
# Job "verify": the whole pipeline tools/verify-all.cjs — reference results regenerated from the pinned
#   sources (Saxon HE 12.8, JDK 21 Xerces), reproducibility of every shipped artefact (engine bundles,
#   rule sets, XSD models, scenarios), all test suites, the OFFICIAL KoSIT validator 1.6.3 with the
#   released XRechnung configuration, and the browser tests in Chromium, WebKit and Firefox. The
#   release gate tools/verify-manifest.cjs --reports --strict requires every suite to have run and
#   passed with the fingerprint of the current inputs. Then the bill of materials of this environment and the
#   search for known vulnerabilities (OSV-Scanner) in the program and in this environment. The test tools come from
#   package-lock.json (npm ci: exact versions, SHA-512 of every package, no install scripts), their registry signatures
#   are verified (npm audit signatures).
# Job "kosit-jar-maven": the KoSIT validator JAR used above (GitHub release asset) must be byte-identical
#   to the copy on Maven Central (org.kosit:validator:1.6.3:standalone, checked with the repository .sha1).
# Job "pdfa-verapdf": full PDF/A-3 validation of the ZUGFeRD corpus with veraPDF 1.30.3 (library
#   org.verapdf:validation-model-jakarta from Maven Central via tools/verapdf/VeraMrr.java, strict
#   checksums; = the veraPDF version of Mustangproject), compared with the container checks
#   (src/pdfa3-checks.js). Procedure and rule mapping: docs/PDFA3-CHECKS.md.
# Job "windows": Windows, the platform the product is made for — the seven browser suites (XSD in the browser,
#   end to end, files written by the page, hostile files, security protections, Peppol import, run time) in Microsoft Edge and Google Chrome as installed on the runner image
#   (Playwright channels msedge / chrome), with the corpus, the Xerces reference and the page built on Windows
#   from byte-identical inputs (checkout without line-ending conversion).
# Job "platforms": the Linux and the Windows run verified the same inputs (filesId) and the same program
#   (programSha256 of the tested page, tools/build-standalone.cjs).
# Job "pages": publication on GitHub Pages — only for a push to main, and only when every job above passed for this
#   commit. Part of this workflow on purpose: no workflow started by another one (workflow_run) runs with write
#   permissions, and the published page is built from the commit this run checked out and verified.
# Every job publishes its result as a check run of the commit ("verification report", "vulnerability scan", "KoSIT JAR
# vs. Maven Central", "veraPDF report", "Windows report", "platform comparison", "pages report"; .github/scripts/check-run.cjs):
# per suite status and summary, and the end of the report of every suite that did not pass — readable with
# GET /repos/{owner}/{repo}/commits/{sha}/check-runs.
name: verify
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read # checkout
      checks: write  # check runs with the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true
      - name: Test tools (package-lock.json, no install scripts, registry signatures verified; browsers from the official Playwright CDN; qpdf and poppler for the PDF files)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit signatures
          npm ls --all --omit=optional || true
          npx playwright install --with-deps chromium webkit firefox
          sudo apt-get install -y --no-install-recommends qpdf poppler-utils python3-jsonschema
          qpdf --version | head -n 1; pdftotext -v 2>&1 | head -n 1; python3 -c 'import pyexpat; print(pyexpat.EXPAT_VERSION)'
          python3 -c 'import importlib.metadata as m; print("jsonschema " + m.version("jsonschema"))'
      - name: Fetch all pinned sources and release artefacts (SHA-256 checked)
        run: node tools/fetch-sources.cjs ext
      - name: KoSIT merge step (XRechnung + whitelisted Peppol rules) and rule compilation
        run: |
          set -e
          sh tools/merge-xrechnung-sch.sh ext
          sh tools/compile-rules.sh ext
          # shipped rule sets reproduced byte-identically; hashes of the compiled Peppol rule sets (integrity check of
          # stored rule sets in the page) unchanged
          git diff --exit-code --stat -- build/schemas build/importable.json
      - name: Build the standalone page
        run: node tools/build-standalone.cjs --version "$(sed -n -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' CHANGELOG.md | head -n 1)"
      - name: Full verification (references, reproducibility, all suites, official KoSIT validator, 3 browsers)
        id: verification
        env:
          ESBUILD_BINARY: ${{ github.workspace }}/node_modules/.bin/esbuild
        run: node tools/verify-all.cjs --ext ext --skip pdfa-verapdf
      - name: Release gate (every suite run and passed with the current fingerprint)
        id: gate
        run: node tools/verify-manifest.cjs ext --reports --strict
      - name: Publish the result as check run "verification report"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ steps.gate.outcome }}
        run: |
          rc=0
          node .github/scripts/check-run.cjs --name "verification report" --sha "${GITHUB_SHA}" \
            --verification build/reports/VERIFICATION.json \
            --gate "${GATE}" --gate-label "Freigabe (verify-manifest --reports --strict)" \
            --attach build/reports/VERIFICATION.json > check-run.json || rc=$?
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" --input check-run.json > /dev/null || echo "::warning::check run could not be published"
          echo "check run published (payload exit code ${rc})"
      - name: Bill of materials of this build and test environment (test-environment.cdx.json; every action pinned to a commit)
        if: always()
        run: node tools/make-test-bom.cjs --require-pinned --out build/reports/test-environment.cdx.json
      - name: Known vulnerabilities of the program and of this environment (OSV-Scanner 2.7.0, release binary, SHA-256 checked)
        # also when a suite failed: the scan does not depend on the test results
        if: always()
        id: osv
        run: |
          set -e
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          node tools/osv-scan.cjs --scanner ./osv-scanner --env build/reports/test-environment.cdx.json --out build/reports/osv-scan.txt
      - name: Publish the result as check run "vulnerability scan"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OSV: ${{ steps.osv.outcome }}
        run: |
          [ -f build/reports/osv-scan.txt ] || echo "osv-scan.txt missing" > build/reports/osv-scan.txt
          rc=0
          node .github/scripts/check-run.cjs --name "vulnerability scan" --sha "${GITHUB_SHA}" \
            --gate "${OSV}" --gate-label "OSV-Scanner: Programm (Stückliste mit Herkunft) und Prüfumgebung, Bewertung in security/vex.json" \
            --attach build/reports/osv-scan.txt > check-run.json || rc=$?
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" --input check-run.json > /dev/null || echo "::warning::check run could not be published"
          exit "${rc}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification
          path: |
            build/reports/
            build/kosit-official/compare.txt
            build/kosit-reference/compare.txt
            build/shots/
            ext/DOWNLOADS.txt
            dist/

  kosit-jar-maven:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      checks: write  # check runs with the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true
      - name: GitHub release asset vs. Maven Central
        id: compare
        run: |
          set -e
          node tools/fetch-sources.cjs ext --only kosit-official
          curl -sSfL -o maven.jar https://repo1.maven.org/maven2/org/kosit/validator/1.6.3/validator-1.6.3-standalone.jar
          curl -sSfL -o maven.jar.sha1 https://repo1.maven.org/maven2/org/kosit/validator/1.6.3/validator-1.6.3-standalone.jar.sha1
          echo "$(cut -c1-40 maven.jar.sha1)  maven.jar" | sha1sum -c -
          cmp maven.jar ext/kosit-official/validator-1.6.3-standalone.jar
          {
            echo "Maven Central org.kosit:validator:1.6.3:standalone, published .sha1: $(cut -c1-40 maven.jar.sha1)"
            sha1sum maven.jar
            sha256sum maven.jar ext/kosit-official/validator-1.6.3-standalone.jar
            echo "cmp maven.jar ext/kosit-official/validator-1.6.3-standalone.jar: identical"
          } | tee jar-compare.txt
      - name: Publish the result as check run "KoSIT JAR vs. Maven Central"
        if: always()
        env:
          OUTCOME_COMPARE: ${{ steps.compare.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          node .github/scripts/check-run.cjs --name "KoSIT JAR vs. Maven Central" --sha "${GITHUB_SHA}" \
            --gate "${OUTCOME_COMPARE}" --gate-label "Vergleich (sha1sum -c, cmp)" --attach jar-compare.txt > check-run.json || rc=$?
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" --input check-run.json > /dev/null || echo "::warning::check run could not be published"
          exit "${rc}"

  pdfa-verapdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # checkout
      checks: write  # check runs with the results
    env:
      VERAPDF_VERSION: '1.30.3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true
      - name: Fetch the pinned ZUGFeRD corpus and Mustangproject
        run: node tools/fetch-sources.cjs ext --only zugferd-corpus,mustangproject
      - name: Resolve veraPDF ${{ env.VERAPDF_VERSION }} (validation-model-jakarta, as used by Mustangproject) and build the runner
        # tools/verapdf/pom.xml: org.verapdf:validation-model-jakarta:${VERAPDF_VERSION}; mvn -C fails on any checksum mismatch.
        run: |
          set -e
          mvn -B -q -C -f tools/verapdf/pom.xml -Dverapdf.version=${VERAPDF_VERSION} \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies \
            -DoutputDirectory="$PWD/verapdf/lib" -DincludeScope=runtime
          JAR=verapdf/lib/validation-model-jakarta-${VERAPDF_VERSION}.jar
          curl -sSfL -o "$JAR.sha1" "https://repo1.maven.org/maven2/org/verapdf/validation-model-jakarta/${VERAPDF_VERSION}/validation-model-jakarta-${VERAPDF_VERSION}.jar.sha1"
          echo "$(cut -c1-40 "$JAR.sha1")  $JAR" | sha1sum -c -
          mkdir -p build/reports verapdf/classes
          (cd verapdf/lib && sha256sum *.jar) > build/reports/verapdf-artifacts.txt
          javac -d verapdf/classes -cp "verapdf/lib/*" tools/verapdf/VeraMrr.java
          printf '#!/bin/sh\nexec java -Xmx3g -cp "%s/lib/*:%s/classes" VeraMrr "$@"\n' "$PWD/verapdf" "$PWD/verapdf" > verapdf/vera-mrr
          chmod +x verapdf/vera-mrr
      - name: Container checks over the corpus (writes build/pdfa3-results.json) and flavour lists
        run: |
          set -e
          node tools/verify-all.cjs --ext ext --only pdfa3-container-checks,verapdf-compare-selftest
          node test/compare-verapdf.cjs --flavour-lists build/verapdf --ours build/pdfa3-results.json --root ext/zugferd-corpus
      - name: veraPDF over the corpus (3b = all PDFs; 3u / 3a = PDFs whose XMP claims it), MRR + text
        run: |
          set -e
          for fl in 3b 3u 3a; do
            mapfile -d '' files < build/verapdf/$fl.list
            if [ ${#files[@]} -eq 0 ]; then echo "$fl: no PDFs"; continue; fi
            rc=0; verapdf/vera-mrr $fl build/verapdf/mrr-$fl.xml "${files[@]}" > build/verapdf/text-$fl.txt 2> build/verapdf/mrr-$fl.log || rc=$?
            echo "veraPDF $fl: ${#files[@]} PDFs, exit code $rc"
            grep -q '</report>' build/verapdf/mrr-$fl.xml || { echo "no complete MRR for $fl"; tail -n 30 build/verapdf/mrr-$fl.log; exit 1; }
          done
          {
            echo "# veraPDF ${VERAPDF_VERSION} (org.verapdf:validation-model-jakarta via tools/verapdf/VeraMrr.java, Maven Central) over the pinned ZUGFeRD corpus"
            echo "# artefacts: build/reports/verapdf-artifacts.txt; commit ${GITHUB_SHA}; $(date -u +%FT%TZ)"
            for fl in 3b 3u 3a; do [ -f build/verapdf/text-$fl.txt ] || continue; echo; echo "## --flavour $fl"; cat build/verapdf/text-$fl.txt; done
          } > build/reports/verapdf.txt
          grep -c -E '^PASS' build/reports/verapdf.txt || true
      - name: Compare veraPDF with the container checks (overlapping rules)
        run: node tools/verify-all.cjs --ext ext --only pdfa-verapdf
      - name: Publish the result as check run "veraPDF report" (fails unless all three suites passed)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          node .github/scripts/check-run.cjs --name "veraPDF report" --sha "${GITHUB_SHA}" \
            --verification build/reports/VERIFICATION.json --require pdfa3-container-checks,verapdf-compare-selftest,pdfa-verapdf \
            --attach build/reports/verapdf-compare.txt --attach build/reports/verapdf-artifacts.txt > check-run.json || rc=$?
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" --input check-run.json > /dev/null || echo "::warning::check run could not be published"
          exit "${rc}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pdfa-verapdf
          path: |
            build/reports/
            build/pdfa3-results.json
            build/verapdf/

  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read # checkout
      checks: write  # check runs with the results
    defaults:
      run:
        shell: bash
    env:
      WINDOWS_SUITES: manifest,ref-corpus,ref-xerces,xml-encoding,page-build,xsd-browser-edge-win,xsd-browser-chrome-win,e2e-edge-win,e2e-chrome-win,reports-browser-edge-win,reports-browser-chrome-win,robustness-browser-edge-win,robustness-browser-chrome-win,security-browser-edge-win,security-browser-chrome-win,peppol-import-edge-win,peppol-import-chrome-win,performance-edge-win,performance-chrome-win
    steps:
      - name: Check out without line-ending conversion (inputs byte-identical with the repository, same filesId as on Linux)
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true
      - name: Working tree = repository (line endings of every file as committed)
        run: git ls-files --eol | awk '{ i = substr($1, 3); w = substr($2, 3); if (i != w) { n++; print } } END { print (n + 0) " files with line endings other than in the repository"; exit (n > 0) }'
      - name: Test tools (package-lock.json, no install scripts, registry signatures verified; Microsoft Edge and Google Chrome of the runner image, no browser download)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit signatures
      - name: Fetch all pinned sources and release artefacts (SHA-256 checked)
        run: node tools/fetch-sources.cjs ext
      - name: Peppol rule sets for the Peppol import test (compiled from the pinned source, never shipped)
        run: |
          set -e
          node tools/compile-sch.cjs ext/peppol-bis-invoice-3/rules/sch/PEPPOL-EN16931-UBL.sch build/schemas/PEPPOL-UBL.json --id PEPPOL-UBL
          node tools/compile-sch.cjs ext/peppol-bis-invoice-3/rules/sch/PEPPOL-EN16931-CII.sch build/schemas/PEPPOL-CII.json --id PEPPOL-CII
      - name: Windows run (inputs, corpus, Xerces reference, page build, browser suites in Edge and Chrome)
        id: verification
        run: node tools/verify-all.cjs --ext ext --only "${WINDOWS_SUITES}"
      - name: Gate (every suite run and passed with the current fingerprint)
        id: gate
        run: node tools/verify-manifest.cjs ext --reports --strict
      - name: Publish the result as check run "Windows report"
        if: always()
        env:
          OUTCOME_GATE: ${{ steps.gate.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          node .github/scripts/check-run.cjs --name "Windows report" --sha "${GITHUB_SHA}" \
            --verification build/reports/VERIFICATION.json --require "${WINDOWS_SUITES}" \
            --gate "${OUTCOME_GATE}" --gate-label "Freigabe (verify-manifest --reports --strict)" \
            --attach build/reports/VERIFICATION.json > check-run.json || rc=$?
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" --input check-run.json > /dev/null || echo "::warning::check run could not be published"
          echo "check run published (payload exit code ${rc})"
          exit "${rc}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-windows
          path: |
            build/reports/
            build/shots/
            dist/BUILD_INFO.json

  platforms:
    needs: [verify, windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
      checks: write  # check runs with the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification
          path: linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-windows
          path: windows
      - name: Compare the Linux and the Windows run (inputs, program, results)
        id: compare
        run: |
          set -o pipefail
          node .github/scripts/compare-platforms.cjs linux windows "${GITHUB_SHA}" | tee platform-comparison.txt
      - name: Publish the result as check run "platform comparison"
        if: always()
        env:
          OUTCOME_COMPARE: ${{ steps.compare.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          node .github/scripts/check-run.cjs --name "platform comparison" --sha "${GITHUB_SHA}" \
            --gate "${OUTCOME_COMPARE}" --gate-label "Vergleich Linux / Windows (.github/scripts/compare-platforms.cjs)" --attach platform-comparison.txt > check-run.json || rc=$?
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" --input check-run.json > /dev/null || echo "::warning::check run could not be published"
          exit "${rc}"

  pages:
    # GitHub Pages (Settings → Pages → Source: "GitHub Actions"). The page is rebuilt from this commit with the
    # verification report of the job verify of this run (artifact "verification"), so the status line in the program
    # ("… Testreihen bestanden … – GitHub Actions …") is the result of exactly these sources (tools/build-standalone.cjs
    # compares the file fingerprint), and its program (programSha256: the page without the build note) must be the one
    # the job verify tested. A version that has a published release keeps its program: until CHANGELOG.md names a new
    # version, the program must be the one of that release (programSha256 of its BUILD_INFO.json), so the page and the
    # file of the release differ at most in the build note (commit, verification run, date). Published beside the
    # program: its SBOM and VEX, the bill of materials of the test environment of this run, the static pages
    # (vulnerability reports, CVD policy, security advisories, information for users, Impressum, privacy) and
    # .well-known (security.txt, the CSAF 2.0 distribution). Every published file gets a
    # build provenance attestation and the program an SBOM attestation (GitHub artifact attestations, Sigstore):
    # `gh attestation verify E-Rechnung-Pruefer.html -R SerhiiAkhnazarov/e-rechnung-pruefer`. After the deployment every
    # published file is read back over HTTPS and compared byte for byte with this build (tools/check-published.cjs).
    # URL, status line, SHA-256 of the published files and the result of the read-back are recorded as check run
    # "pages report" of the commit.
    needs: [verify, kosit-jar-maven, pdfa-verapdf, windows, platforms]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read      # checkout; the release of this version (program comparison)
      pages: write        # deployment
      id-token: write     # deployment and artifact attestations (Sigstore)
      attestations: write # artifact attestations
      checks: write       # check run "pages report"
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true
      - name: Verification report of the job verify of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification
          path: ci-verification
      - name: Build the page with the CI verification status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e -o pipefail
          {
            # build/reports/ is not part of the repository (outputs are built in CI only)
            mkdir -p build/reports
            cp ci-verification/build/reports/VERIFICATION.json build/reports/VERIFICATION.json
            VERSION="$(sed -n -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' CHANGELOG.md | head -n 1)"
            node tools/build-standalone.cjs --version "${VERSION}"
            # the status line must come from this CI run and report every suite as passed ("N von N … 0 fehlgeschlagen")
            node -e "const b = require('./dist/BUILD_INFO.json'); console.log('version: ' + b.version + ', verification: ' + b.verification); if (!/GitHub Actions/.test(b.verification) || !/^(\d+) von \1 Testreihen bestanden, 0 fehlgeschlagen/.test(b.verification)) process.exit(1)"
            # the program to be published is the program the job verify tested (same page apart from the build note)
            node -e "const a = require('./dist/BUILD_INFO.json'), t = require('./ci-verification/dist/BUILD_INFO.json'); console.log('program SHA-256: to be published ' + a.programSha256 + ', tested ' + t.programSha256); if (!a.programSha256 || a.programSha256 !== t.programSha256) process.exit(1)"
            # a version with a published release keeps its program (a changed program needs a new version in CHANGELOG.md):
            # the program to be published is the program of the release of this version, if there is one
            mkdir -p release-check
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" > release-check/release.json 2> release-check/error.txt; then
              ASSET="$(node -e "const r = require('./release-check/release.json'); const a = (r.assets || []).find((x) => x.name === 'BUILD_INFO.json'); if (!a) { console.error('release ' + r.tag_name + ' has no BUILD_INFO.json'); process.exit(1); } console.log(a.id)")"
              gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET}" > release-check/BUILD_INFO.json
              node -e "const a = require('./dist/BUILD_INFO.json'), r = require('./release-check/BUILD_INFO.json'); console.log('program SHA-256: release v' + r.version + ' ' + r.programSha256 + ', to be published ' + a.programSha256); if (r.version !== a.version || r.programSha256 !== a.programSha256) { console.log('the program differs from the release of version ' + r.version + ' – a changed program needs a new version in CHANGELOG.md'); process.exit(1); }"
            elif grep -q 'HTTP 404' release-check/error.txt; then
              echo "release v${VERSION}: not published yet"
            else
              cat release-check/error.txt
              exit 1
            fi
            mkdir -p site
            cp dist/E-Rechnung-Pruefer.html site/index.html
            cp dist/E-Rechnung-Pruefer.html site/E-Rechnung-Pruefer.html
            cp dist/BUILD_INFO.json site/BUILD_INFO.json
            cp dist/sbom.cdx.json site/sbom.cdx.json
            cp dist/vex.cdx.json site/vex.cdx.json
            cp build/STANDARDS_MANIFEST.json site/STANDARDS_MANIFEST.json
            cp build/reports/VERIFICATION.json site/VERIFICATION.json
            cp ci-verification/build/reports/test-environment.cdx.json site/test-environment.cdx.json
            # static pages and .well-known (security.txt, CSAF): hidden files included
            cp -R dist/site-pages/. site/
            (cd site && find . -type f | sort | sed 's#^\./##' | xargs sha256sum) | tee site-files.txt
          } 2>&1 | tee pages-build.txt
      - name: Build provenance of every published file (GitHub artifact attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            site/E-Rechnung-Pruefer.html
            site/BUILD_INFO.json
            site/sbom.cdx.json
            site/vex.cdx.json
            site/test-environment.cdx.json
            site/STANDARDS_MANIFEST.json
            site/VERIFICATION.json
            site/.well-known/security.txt
            site/.well-known/csaf/provider-metadata.json
            site/.well-known/csaf/white/*/*.json
      - name: SBOM attestation of the program (sbom.cdx.json)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: site/E-Rechnung-Pruefer.html
          sbom-path: site/sbom.cdx.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Read every published file back (HTTPS, as a visitor gets it) and compare it with this build
        id: published
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -o pipefail
          node tools/check-published.cjs "${PAGE_URL}" --commit "${GITHUB_SHA}" --local site \
            --expect-sha256 "$(node -e "console.log(require('./dist/BUILD_INFO.json').sha256)")" | tee published-check.txt
      - name: Publish the deployment as check run "pages report"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          VERIFY_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYMENT: ${{ steps.deployment.outcome }}
          PUBLISHED: ${{ steps.published.outcome }}
        run: |
          {
            echo "page: ${PAGE_URL:-not deployed}"
            echo "verify run: ${VERIFY_RUN}"
            node -e "const b = require('./dist/BUILD_INFO.json'); console.log('version: ' + b.version); console.log('verification: ' + b.verification); console.log('page SHA-256: ' + b.sha256); console.log('program SHA-256: ' + b.programSha256)" || true
            echo
            echo "published files (SHA-256):"
            cat site-files.txt 2>/dev/null || true
            echo
            echo "build (step \"Build the page with the CI verification status\"):"
            cat pages-build.txt 2>/dev/null || echo "not run"
            echo
            echo "read back over HTTPS (tools/check-published.cjs):"
            cat published-check.txt 2>/dev/null || echo "not run"
          } > pages-report.txt
          outcome=failure
          if [ "${DEPLOYMENT}" = success ] && [ "${PUBLISHED}" = success ]; then outcome=success; fi
          rc=0
          node .github/scripts/check-run.cjs --name "pages report" --sha "${GITHUB_SHA}" \
            --gate "${outcome}" --gate-label "Deployment (actions/deploy-pages) und Abruf der veröffentlichten Dateien (tools/check-published.cjs)" --attach pages-report.txt > check-run.json || rc=$?
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" --input check-run.json > /dev/null || echo "::warning::check run could not be published"
          exit "${rc}"
