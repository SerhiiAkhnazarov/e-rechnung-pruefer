# release.yml — publishes the current state of main as a GitHub release, started by hand
# (Actions → release → Run workflow). Nothing is built here: the release carries exactly the files that
# GitHub Pages serves for this commit, read back over HTTPS and checked by tools/check-published.cjs
# (page = BUILD_INFO.json, verification report of this commit from GitHub Actions with every suite passed,
# standards manifest). Preconditions, checked before anything is created:
#   - every check run of the commit passed: "verification report", "Windows report", "platform comparison",
#     "veraPDF report", "KoSIT JAR vs. Maven Central", "vulnerability scan", "pages report" (workflow verify) and
#     "code scanning (javascript-typescript)", "code scanning (actions)" (workflow security: no open CodeQL result);
#   - the version (first "## x.y.z" of CHANGELOG.md) has no release yet (tag vx.y.z).
# Assets: E-Rechnung-Pruefer.html, BUILD_INFO.json, VERIFICATION.json, STANDARDS_MANIFEST.json, sbom.cdx.json, vex.cdx.json,
# test-environment.cdx.json, SHA256SUMS.txt (GitHub adds the source code of the tag as zip and tar.gz), and
# E-Rechnung-Pruefer-<version>.intoto.jsonl: the Sigstore bundles of the attestations made when the job "pages" of
# verify.yml published these files (build provenance, SLSA v1, of every file; SBOM attestation of the program), so that
# they can be verified without the GitHub API: gh attestation verify <file> -R <repository> --bundle <that file>. Every
# asset is verified against these bundles (signer: verify.yml of this repository) before the release is created.
# Release notes: the CHANGELOG section of the version. Until the next version the site serves the same program
# (the job "pages" of verify.yml compares programSha256 with the release); later commits change only the build note.
# The result is recorded as check run "release report" of the commit.
name: release
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write    # the release and its tag
      checks: write      # check run "release report"
      pages: read        # URL of the site
      attestations: read # the attestations of the published files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true
      - name: Version, commit and preconditions
        id: pre
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e -o pipefail
          SHA="$(git rev-parse HEAD)"
          VERSION="$(sed -n -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' CHANGELOG.md | head -n 1)"
          TAG="v${VERSION}"
          echo "commit ${SHA}, version ${VERSION}, tag ${TAG}"
          if gh release view "${TAG}" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "::error::${TAG} exists already – a new release needs a new version in CHANGELOG.md"; exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" --paginate \
            --jq '.check_runs[] | [.name, .conclusion, .completed_at, .html_url] | @tsv' > check-runs.tsv
          missing=0
          for name in "verification report" "Windows report" "platform comparison" "veraPDF report" "KoSIT JAR vs. Maven Central" "vulnerability scan" "pages report" "code scanning (javascript-typescript)" "code scanning (actions)"; do
            row="$(awk -F '\t' -v n="${name}" '$1 == n' check-runs.tsv | sort -t "$(printf '\t')" -k3 | tail -n 1)"
            conclusion="$(printf '%s' "${row}" | cut -f2)"
            echo "${name}: ${conclusion:-missing} $(printf '%s' "${row}" | cut -f4)"
            if [ "${conclusion}" != success ]; then missing=1; fi
          done
          if [ "${missing}" != 0 ]; then echo "::error::not every check run of ${SHA} passed – no release"; exit 1; fi
          PAGE_URL="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url)"
          { echo "sha=${SHA}"; echo "version=${VERSION}"; echo "tag=${TAG}"; echo "page_url=${PAGE_URL}"; } >> "${GITHUB_OUTPUT}"
      - name: The published files of this commit (read back over HTTPS and checked)
        id: published
        env:
          PAGE_URL: ${{ steps.pre.outputs.page_url }}
          SHA: ${{ steps.pre.outputs.sha }}
        run: |
          set -o pipefail
          node tools/check-published.cjs "${PAGE_URL}" --commit "${SHA}" --out release --retries 3 --wait 20 | tee published-check.txt
      - name: Attestations of the release files (Sigstore bundles), every file verified against them
        id: attestations
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pre.outputs.version }}
        run: |
          set -e -o pipefail
          mkdir -p attestations
          for f in E-Rechnung-Pruefer.html BUILD_INFO.json VERIFICATION.json STANDARDS_MANIFEST.json sbom.cdx.json vex.cdx.json test-environment.cdx.json; do
            rm -f attestations/*.jsonl
            (cd attestations && gh attestation download "../release/${f}" -R "${GITHUB_REPOSITORY}")
            cat attestations/*.jsonl >> attestations/all.txt
          done
          # one line per bundle (the build provenance covers every file, the SBOM attestation the program)
          awk 'NF && !seen[$0]++' attestations/all.txt > "release/E-Rechnung-Pruefer-${VERSION}.intoto.jsonl"
          echo "$(wc -l < "release/E-Rechnung-Pruefer-${VERSION}.intoto.jsonl") bundles in E-Rechnung-Pruefer-${VERSION}.intoto.jsonl"
          for f in E-Rechnung-Pruefer.html BUILD_INFO.json VERIFICATION.json STANDARDS_MANIFEST.json sbom.cdx.json vex.cdx.json test-environment.cdx.json; do
            gh attestation verify "release/${f}" -R "${GITHUB_REPOSITORY}" --bundle "release/E-Rechnung-Pruefer-${VERSION}.intoto.jsonl" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/verify.yml" > /dev/null
            echo "${f}: build provenance verified (Sigstore bundle, signer workflow verify.yml)"
          done
          gh attestation verify release/E-Rechnung-Pruefer.html -R "${GITHUB_REPOSITORY}" --bundle "release/E-Rechnung-Pruefer-${VERSION}.intoto.jsonl" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/verify.yml" --predicate-type https://cyclonedx.org/bom > /dev/null
          echo "E-Rechnung-Pruefer.html: SBOM attestation verified (CycloneDX)"
      - name: Release notes (CHANGELOG section of the version)
        env:
          PAGE_URL: ${{ steps.pre.outputs.page_url }}
          SHA: ${{ steps.pre.outputs.sha }}
          VERSION: ${{ steps.pre.outputs.version }}
        run: |
          set -e
          {
            awk -v v="${VERSION}" '/^## / { if (p) exit; if ($2 == v) { p = 1; next } } p' CHANGELOG.md
            echo
            echo "---"
            echo "Prüfnachweise dieses Stands (Commit ${SHA}): Check-Runs „verification report“, „Windows report“, „platform comparison“, „veraPDF report“, „KoSIT JAR vs. Maven Central“, „vulnerability scan“, „pages report“, „code scanning (javascript-typescript)“, „code scanning (actions)“ – \`GET /repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs\`."
            echo "Die Datei E-Rechnung-Pruefer.html ist byte-gleich mit der Seite, die ${PAGE_URL} bei Veröffentlichung dieses Releases ausgeliefert hat (Commit ${SHA}; SHA-256 in SHA256SUMS.txt). Bis zur nächsten Version enthält die Seite dasselbe Programm (\`programSha256\` in BUILD_INFO.json, vor jeder Veröffentlichung der Seite geprüft); spätere Commits ändern nur den Build-Vermerk (Commit, Prüflauf, Datum). Herkunftsnachweis: \`gh attestation verify E-Rechnung-Pruefer.html -R ${GITHUB_REPOSITORY}\`, ohne Abruf über die GitHub-API mit \`--bundle E-Rechnung-Pruefer-${VERSION}.intoto.jsonl\` (Sigstore-Bundles der Nachweise: Herkunft jeder Datei nach SLSA v1, Stückliste des Programms)."
          } > release-notes.md
          cat release-notes.md
      - name: Create the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pre.outputs.sha }}
          VERSION: ${{ steps.pre.outputs.version }}
          TAG: ${{ steps.pre.outputs.tag }}
        run: |
          set -e
          gh release create "${TAG}" release/E-Rechnung-Pruefer.html release/BUILD_INFO.json release/VERIFICATION.json \
            release/STANDARDS_MANIFEST.json release/sbom.cdx.json release/vex.cdx.json release/test-environment.cdx.json release/SHA256SUMS.txt \
            "release/E-Rechnung-Pruefer-${VERSION}.intoto.jsonl" \
            --target "${SHA}" --title "E-Rechnung Prüfer ${VERSION}" --notes-file release-notes.md
          gh release view "${TAG}" --json url,tagName,assets --jq '"release: " + .url, (.assets[] | .name + " " + (.size | tostring) + " bytes")' | tee release-view.txt
      - name: Publish the result as check run "release report"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pre.outputs.sha || github.sha }}
          VERSION: ${{ steps.pre.outputs.version }}
          TAG: ${{ steps.pre.outputs.tag }}
          OUTCOME: ${{ steps.release.outcome }}
        run: |
          {
            echo "commit: ${SHA}, version ${VERSION}, tag ${TAG}"
            cat check-runs.tsv 2>/dev/null | cut -f1,2 || true
            echo
            cat published-check.txt 2>/dev/null || true
            echo
            cat release/SHA256SUMS.txt 2>/dev/null || true
            cat release-view.txt 2>/dev/null || echo "no release created"
          } > release-report.txt
          rc=0
          node .github/scripts/check-run.cjs --name "release report" --sha "${SHA}" \
            --gate "${OUTCOME}" --gate-label "Release (gh release create)" --attach release-report.txt > check-run.json || rc=$?
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" --input check-run.json > /dev/null || echo "::warning::check run could not be published"
          exit "${rc}"
