# scorecard.yml — OpenSSF Scorecard (https://scorecard.dev): automated assessment of the security practices of this
# repository (pinned dependencies, token permissions, branch protection, code review, SAST, vulnerabilities, signed
# releases …). Results in the Security tab (code scanning) and published on scorecard.dev for this public repository.
# The form of this workflow is fixed by the scorecard action (no run steps, read-only top-level permissions).
name: scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: '27 6 * * 3'   # Wednesdays 06:27 UTC
  push:
    branches: [main]
permissions: read-all # zizmor: ignore[excessive-permissions] – the form required by the scorecard action (read only)
concurrency:
  group: scorecard
  cancel-in-progress: false
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      security-events: write # code scanning results
      id-token: write        # publishing the results on scorecard.dev
      contents: read         # checkout
      actions: read          # workflow information
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 30
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
